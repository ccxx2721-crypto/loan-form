<script>
const LIFF_ID = '2008741675-rwpbbLaf';
const API_URL = 'https://script.google.com/macros/s/AKfycbz9MxvyH9bHj5_glCdJaXPiHN4jcrPJU1izQvHzgE1UJTFuOGSaCBjEpTmEICH7lwS4/exec';

const steps = [
  { key:'name', text:'請輸入姓名' },
  { key:'phone', text:'請輸入手機號碼' },
  { key:'birthday', text:'請輸入生日' },
  { key:'requestAmount', text:'請輸入申請額度' },
  { key:'purpose', text:'請輸入資金用途' }
];

let i = 0;
let data = {};

async function init() {
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) return liff.login();

  const p = await liff.getProfile();
  data.userId = p.userId;
  show();
}

function show() {
  q.innerText = steps[i].text;
  a.value = '';
  a.placeholder = steps[i].text;
}

btn.onclick = async () => {
  if (!a.value) return alert('請輸入');

  data[steps[i].key] = a.value;
  i++;

  if (i < steps.length) return show();

  btn.disabled = true;
  q.innerText = '送出中…';

  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (!result.success) {
    alert('送出失敗');
    btn.disabled = false;
    q.innerText = '請重新送出';
    return;
  }

  await liff.sendMessages([{
    type: 'text',
    text:
`📩 新貸款申請
姓名：${data.name}
手機：${data.phone}
生日：${data.birthday}
金額：${data.requestAmount}
用途：${data.purpose}`
  }]);

  alert('申請完成');
  liff.closeWindow();
};

init();
</script>
