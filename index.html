<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LIFF 測試</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<h2 id="status">LIFF 載入中…</h2>

<script>
const LIFF_ID = '2008741675-rwpbbLaf'; // 你最新那個

async function main() {
  try {
    document.getElementById('status').innerText = '開始 init LIFF';

    await liff.init({ liffId: LIFF_ID });

    document.getElementById('status').innerText = 'LIFF init 成功';

    if (!liff.isLoggedIn()) {
      document.getElementById('status').innerText = '尚未登入，導向登入';
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    document.getElementById('status').innerText =
      '登入成功：' + profile.displayName;

  } catch (err) {
    document.getElementById('status').innerText =
      '❌ 發生錯誤：' + err.message;
  }
}

main();
</script>

</body>
</html>
