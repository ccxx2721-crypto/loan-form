<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>貸款申請</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { width: 100%; font-size: 18px; padding: 10px; margin-top: 10px; }
    button { background: #06c755; color: #fff; border: none; border-radius: 5px; }
  </style>
</head>
<body>

<h3 id="q">載入中…</h3>
<input id="a" placeholder="">
<button id="btn" onclick="next()">下一步</button>

<script>
const LIFF_ID = '2008741675-rwpbbLaf';
const API_URL = 'https://script.google.com/macros/s/AKfycbxZwyeJIFUIT0GpuZfTf12fuTFyyxmGIwd4R_izqyuLTfPBTGp77ZsazV5GetYlWps/exec';

const steps = [
  { key: 'name', text: '請輸入姓名' },
  { key: 'phone', text: '請輸入手機號碼' },
  { key: 'requestAmount', text: '請輸入申請額度' }
];

let i = 0;
let data = {};

async function init() {
  document.getElementById('q').innerText = 'LIFF 初始化中…';

  await liff.init({ liffId: LIFF_ID });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const profile = await liff.getProfile();
  data.userId = profile.userId;

  show();
}

function show() {
  document.getElementById('q').innerText = steps[i].text;
  document.getElementById('a').value = '';
  document.getElementById('a').placeholder = steps[i].text;
}

async function next() {
  data[steps[i].key] = document.getElementById('a').value;
  i++;

  if (i < steps.length) {
    show();
  } else {
    document.getElementById('q').innerText = '送出中…';
    document.getElementById('btn').disabled = true;

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const r = await res.json();

    if (!r.success) {
      alert('送出失敗，請稍後再試');
      document.getElementById('btn').disabled = false;
      return;
    }

    alert('申請完成');
    liff.closeWindow();
  }
}

init();
</script>

</body>
</html>
