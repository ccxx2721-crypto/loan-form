<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>貸款申請</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<h3 id="q">載入中…</h3>
<input id="a">
<button id="btn">下一步</button>

<script>
const LIFF_ID = '2008741675-rwpbbLaf';
const API_URL = 'https://script.google.com/macros/s/【你的GAS部署ID】/exec';

const steps = [
  {k:'name', t:'姓名'},
  {k:'phone', t:'手機'},
  {k:'amount', t:'申請金額'}
];

let i=0, data={};

async function init(){
  await liff.init({ liffId: LIFF_ID });
  if(!liff.isLoggedIn()) return liff.login();
  const p = await liff.getProfile();
  data.userId = p.userId;
  show();
}

function show(){
  q.innerText = steps[i].t;
  a.value='';
}

btn.onclick = async ()=>{
  data[steps[i].k] = a.value;
  i++;
  if(i<steps.length) return show();

  q.innerText = '送出中…';

  const r = await fetch(API_URL,{
    method:'POST',
    body: JSON.stringify(data)
  });
  const j = await r.json();

  if(j.ok){
    alert('已送出');
    liff.closeWindow();
  }else{
    alert('送出失敗');
  }
};

init();
</script>
</body>
</html>
