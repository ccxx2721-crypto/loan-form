<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貸款申請</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body { font-family: Arial; padding:20px; }
  input, button {
    width:100%; padding:12px; font-size:18px; margin-top:12px;
  }
  button {
    background:#06c755; color:#fff; border:none; border-radius:8px;
  }
  button:disabled { opacity:.6; }
  .step { font-size:13px; color:#666; margin-top:6px; }
</style>
</head>
<body>

<h3 id="q">初始化中…</h3>
<div class="step" id="step"></div>

<input id="a" placeholder="">
<button id="btn">下一步</button>

<script>
const LIFF_ID = '2008741675-qAksMTVG'; // ✅ 你的 LIFF v2 ID

const steps = [
  const steps = [
  { key:'name', text:'請輸入姓名' },
  { key:'phone', text:'請輸入手機號碼' },
  { key:'birthday', text:'請輸入生日（YYYY/MM/DD）' },
  { key:'idNumber', text:'請輸入身分證字號' },
  { key:'address', text:'請輸入居住地（縣市即可）' },
  { key:'job', text:'請輸入職業' },
  { key:'companyName', text:'請輸入公司名稱' },
  { key:'jobYears', text:'請輸入在職年資（例如：3年）' },
  { key:'monthlyIncome', text:'請輸入月收入' },
  { key:'salaryInsurance', text:'是否有薪轉或勞保' },
  { key:'hasHouse', text:'是否有房屋或土地' },
  { key:'hasVehicle', text:'是否有汽車或機車' },
  { key:'creditCard', text:'信用卡狀況（銀行/額度/使用）' },
  { key:'bankLoan', text:'銀行貸款（銀行/總額/每月）' },
  { key:'financeLoan', text:'融資借款（項目/金額）' },
  { key:'privateLoan', text:'民間借款（當鋪/小額）' },
  { key:'hasNegotiation', text:'是否有協商或法扣' },
  { key:'isWarning', text:'是否為警示戶' },
  { key:'hasPaymentOrder', text:'是否有支付命令' },
  { key:'hasUnpaidFine', text:'是否有未繳罰單' },
  { key:'hasBadDebt', text:'是否有銀行或融資呆帳' },
  { key:'hasLatePayment', text:'是否有銀行或融資遲繳' },
  { key:'lateHowLong', text:'遲繳多久' },
  { key:'recentApply', text:'近期是否有送貸款' },
  { key:'requestAmount', text:'此次申請額度' },
  { key:'purpose', text:'資金用途' }
];

let i = 0;
const data = {};

const q = document.getElementById('q');
const stepEl = document.getElementById('step');
const input = document.getElementById('a');
const btn = document.getElementById('btn');

function render() {
  q.innerText = steps[i].text;
  stepEl.innerText = `第 ${i + 1} / ${steps.length} 題`;
  input.value = '';
  input.placeholder = steps[i].text;
  input.disabled = false;
  btn.disabled = false;
  input.focus();
}

async function init() {
  try {
    q.innerText = 'LIFF 初始化中…';
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    data.userId = profile.userId;

    i = 0;
    render();

  } catch (e) {
    q.innerText = '初始化失敗';
    stepEl.innerText = e.message || String(e);
    input.disabled = true;
    btn.disabled = true;
  }
}

btn.onclick = async () => {
  const val = input.value.trim();
  if (!val) {
    alert('請填寫後再繼續');
    return;
  }

  data[steps[i].key] = val;
  i++;

  if (i < steps.length) {
    render();
    return;
  }

  // 最後送出
  const message =
`【貸款申請】
姓名：${data.name}
手機：${data.phone}
生日：${data.birthday}
申請額度：${data.requestAmount}
用途：${data.purpose}`;

  q.innerText = '送出中…';
  stepEl.innerText = '';
  input.disabled = true;
  btn.disabled = true;

  try {
    await liff.sendMessages([{ type:'text', text: message }]);
    q.innerText = '已送出 ✅';
    stepEl.innerText = '感謝您的填寫';
    setTimeout(() => liff.closeWindow(), 600);
  } catch (e) {
    q.innerText = '送出失敗';
    btn.disabled = false;
    input.disabled = false;
    alert('送出失敗，請稍後再試');
    render();
  }
};

init();
</script>

</body>
</html>
