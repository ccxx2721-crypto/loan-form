<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>貸款申請</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body { font-family: Arial; padding:20px; }
input, button {
  width:100%; padding:12px; font-size:18px; margin-top:12px;
}
button {
  background:#06c755; color:#fff; border:none; border-radius:6px;
}
</style>
</head>
<body>

<h3 id="q">載入中…</h3>
<input id="a" placeholder="">
<button id="btn">下一步</button>

<script>
const LIFF_ID = '2008741675-rwpbbLaf'; // 你目前最新的 LIFF ID

const steps = [
  { key:'name', text:'請輸入姓名' },
  { key:'phone', text:'請輸入手機號碼' },
  { key:'birthday', text:'請輸入生日' },
  { key:'requestAmount', text:'請輸入申請額度' },
  { key:'purpose', text:'請輸入資金用途' }
];

let i = 0;
let data = {};

async function init() {
  await liff.init({ liffId: LIFF_ID });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const p = await liff.getProfile();
  data.userId = p.userId;

  show();
}

function show() {
  document.getElementById('q').innerText = steps[i].text;
  document.getElementById('a').value = '';
  document.getElementById('a').placeholder = steps[i].text;
}

document.getElementById('btn').onclick = async () => {
  const input = document.getElementById('a');
  if (!input.value) return alert('請填寫');

  data[steps[i].key] = input.value;
  i++;

  if (i < steps.length) {
    show();
    return;
  }

  document.getElementById('q').innerText = '送出中…';
  document.getElementById('btn').disabled = true;

  // ⭐ 只做一件事：送 LINE 訊息
const msg =
`#貸款申請
姓名：${data.name}
手機：${data.phone}
生日：${data.birthday}
申請額度：${data.requestAmount}
用途：${data.purpose}`;

await liff.sendMessages([
  {
    type: 'text',
    text: msg
  }
]);

liff.closeWindow();


init();
</script>
</body>
</html>
