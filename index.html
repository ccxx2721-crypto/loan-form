<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>貸款申請</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body { font-family: Arial; padding:20px; }
input, button {
  width:100%; padding:12px; font-size:18px; margin-top:12px;
}
button {
  background:#06c755; color:#fff; border:none; border-radius:6px;
}
</style>
</head>
<body>

<h3 id="q">載入中…</h3>
<input id="a">
<button id="btn">下一步</button>

<script>
const LIFF_ID = '2008741675-rwpbbLaf';
const API_URL = 'https://script.google.com/macros/s/AKfycbwescUdEwyPiVwEuJ_AY5HWuxmKaWDjYl3SKr11_cBDNVIm5jhe37LLhF_hHDPI-zIq/exec';

const steps = [
  { key:'name', text:'請輸入姓名' },
  { key:'phone', text:'請輸入手機' },
  { key:'birthday', text:'請輸入生日' },
  { key:'requestAmount', text:'請輸入申請額度' },
  { key:'purpose', text:'請輸入資金用途' }
];

let i = 0;
let data = {};

async function init() {
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) {
    liff.login(); return;
  }
  const p = await liff.getProfile();
  data.userId = p.userId;
  show();
}

function show() {
  document.getElementById('q').innerText = steps[i].text;
  document.getElementById('a').value = '';
}

document.getElementById('btn').onclick = async () => {
  const val = document.getElementById('a').value;
  if (!val) return alert('請填寫');
  data[steps[i].key] = val;
  i++;

  if (i < steps.length) return show();

  document.getElementById('q').innerText = '送出中…';
  document.getElementById('btn').disabled = true;

  try {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  const text = await res.text();
  console.log('GAS 回傳：', text);

  alert('申請完成');
  liff.closeWindow();

} catch (e) {
  console.error(e);
  alert('送出失敗，請稍後再試');
  document.getElementById('btn').disabled = false;
}
