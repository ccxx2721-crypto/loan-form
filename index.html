<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFF 測試</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<h2 id="status">HTML 已載入</h2>

<script>
const LIFF_ID = '2008741675-qAksMTVG'; // 你現在用的

(async () => {
  try {
    document.getElementById('status').innerText = '開始 liff.init()';
    await liff.init({ liffId: LIFF_ID });
    document.getElementById('status').innerText = 'liff.init() 成功';

    if (!liff.isLoggedIn()) {
      document.getElementById('status').innerText = '未登入，呼叫 login()';
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    document.getElementById('status').innerText =
      '完成，userId：' + profile.userId;

  } catch (e) {
    document.getElementById('status').innerText =
      '錯誤：' + (e.message || e);
  }
})();
</script>

</body>
</html>
