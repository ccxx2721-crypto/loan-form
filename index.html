<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>貸款申請</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body { font-family: Arial; padding:20px; }
input, button {
  width:100%; padding:12px; font-size:18px; margin-top:12px;
}
button {
  background:#06c755; color:#fff; border:none; border-radius:6px;
}
</style>
</head>
<body>

<h3 id="q">初始化中…</h3>
<input id="a" placeholder="">
<button id="btn">下一步</button>

<script>
/* ===== 基本設定 ===== */
const LIFF_ID = '2008741675-qAksMTVG'; // 你目前可用的 LIFF ID

const steps = [
  { key:'name', text:'請輸入姓名' },
  { key:'phone', text:'請輸入手機號碼' },
  { key:'birthday', text:'請輸入生日（YYYY/MM/DD）' },
  { key:'idNumber', text:'請輸入身分證字號' },
  { key:'address', text:'請輸入居住地' },
  { key:'job', text:'請輸入職業' },
  { key:'companyName', text:'請輸入公司名' },
  { key:'jobYears', text:'請輸入在職年資' },
  { key:'monthlyIncome', text:'請輸入月收入' },
  { key:'salaryInsurance', text:'是否有薪轉或勞保' },
  { key:'hasHouse', text:'是否有房屋或土地' },
  { key:'hasVehicle', text:'是否有汽車或機車' },
  { key:'creditCard', text:'信用卡狀況' },
  { key:'bankLoan', text:'銀行貸款' },
  { key:'financeLoan', text:'融資借款' },
  { key:'privateLoan', text:'民間借款' },
  { key:'hasNegotiation', text:'是否有協商或法扣' },
  { key:'isWarning', text:'是否為警示戶' },
  { key:'hasPaymentOrder', text:'是否有支付命令' },
  { key:'hasUnpaidFine', text:'是否有未繳罰單' },
  { key:'hasBadDebt', text:'是否有呆帳' },
  { key:'hasLatePayment', text:'是否有遲繳' },
  { key:'lateHowLong', text:'遲繳多久' },
  { key:'recentApply', text:'近期是否送貸' },
  { key:'requestAmount', text:'此次申請額度' },
  { key:'purpose', text:'資金用途' }
];

let i = 0;
let data = {};

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    data.userId = profile.userId;

    show();
  } catch (e) {
    document.getElementById('q').innerText = '初始化失敗，請重新開啟';
  }
}

function show() {
  document.getElementById('q').innerText = steps[i].text;
  const input = document.getElementById('a');
  input.value = '';
  input.placeholder = steps[i].text;
}

document.getElementById('btn').addEventListener('click', () => {
  const input = document.getElementById('a');
  if (!input.value) {
    alert('請填寫後再繼續');
    return;
  }

  data[steps[i].key] = input.value;
  i++;

  if (i < steps.length) {
    show();
  } else {
    document.getElementById('q').innerText = '完成，感謝填寫';
    document.getElementById('btn').disabled = true;
    console.log('表單資料：', data);
    liff.closeWindow();
  }
});

/* ⚠️ 關鍵：不要用 DOMContentLoaded，直接呼叫 */
init();
</script>

</body>
</html>
