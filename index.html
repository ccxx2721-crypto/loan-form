<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>貸款申請</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.6;
    }
    h3 {
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 18px;
      background-color: #06c755;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    button:disabled {
      background-color: #aaa;
    }
  </style>
</head>

<body>

<h3 id="q">載入中…</h3>
<input id="a" placeholder="">
<button id="btn" onclick="next()">下一步</button>

<script>
/* ===== 必填設定 ===== */
const LIFF_ID = '2008741675-rwpbbLaf'; 
const API_URL = 'https://script.google.com/macros/s/AKfycby3aR4E7wbIKEWFkPdbR-U7Dl_KbI7hftJCOKTjLTRcqQJb4e0cJ3GijAk7qXuKbw4/exec';

/* ===== 題目流程 ===== */
const steps = [
  { key: 'name', text: '請輸入姓名' },
  { key: 'phone', text: '請輸入手機號碼' },
  { key: 'birthday', text: '請輸入生日（YYYY/MM/DD）' },
  { key: 'idNumber', text: '請輸入身分證字號' },
  { key: 'address', text: '請輸入居住地' },
  { key: 'job', text: '請輸入職業' },
  { key: 'companyName', text: '請輸入公司名稱' },
  { key: 'jobYears', text: '請輸入在職年資' },
  { key: 'monthlyIncome', text: '請輸入月收入' },
  { key: 'salaryInsurance', text: '是否有薪轉／勞保' },
  { key: 'hasHouse', text: '是否有房屋土地' },
  { key: 'hasVehicle', text: '是否有汽車機車' },
  { key: 'creditCard', text: '信用卡狀況' },
  { key: 'bankLoan', text: '銀行貸款' },
  { key: 'financeLoan', text: '融資貸款' },
  { key: 'privateLoan', text: '民間借款' },
  { key: 'hasNegotiation', text: '是否有協商／法扣' },
  { key: 'isWarning', text: '是否為警示戶' },
  { key: 'hasPaymentOrder', text: '是否有支付命令' },
  { key: 'hasUnpaidFine', text: '是否有未繳罰單' },
  { key: 'hasBadDebt', text: '是否有呆帳' },
  { key: 'hasLatePayment', text: '是否有遲繳' },
  { key: 'lateHowLong', text: '遲繳多久' },
  { key: 'recentApply', text: '近期是否送貸' },
  { key: 'requestAmount', text: '此次申請額度' },
  { key: 'purpose', text: '資金用途' }
];

let i = 0;
let data = {};

/* ===== 初始化 ===== */
async function init() {
  document.getElementById('q').innerText = 'LIFF 初始化中…';

  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    data.userId = profile.userId;

    show();

  } catch (err) {
    alert('LIFF 初始化失敗');
    console.error(err);
  }
}

/* ===== 顯示題目 ===== */
function show() {
  document.getElementById('q').innerText = steps[i].text;
  document.getElementById('a').value = '';
  document.getElementById('a').placeholder = steps[i].text;
}

/* ===== 下一步 / 送出 ===== */
async function next() {
  data[steps[i].key] = document.getElementById('a').value;
  i++;

  if (i < steps.length) {
    show();
    return;
  }

  document.getElementById('q').innerText = '送出中…';
  document.getElementById('btn').disabled = true;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    await res.text(); // ⭐ 不等 JSON，避免卡死

    alert('申請完成，專員將盡快與您聯繫');
    liff.closeWindow();

  } catch (err) {
    console.error(err);
    alert('送出失敗，請稍後再試');
    document.getElementById('btn').disabled = false;
    document.getElementById('q').innerText = '發生錯誤，請重試';
  }
}

/* ===== 啟動 ===== */
init();
</script>

</body>
</html>
