<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>貸款申請</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body { font-family: Arial; padding:20px; }
input, button {
  width:100%; padding:12px; font-size:18px; margin-top:12px;
}
button {
  background:#06c755; color:#fff; border:none; border-radius:6px;
}
</style>
</head>
<body>

<h3 id="q">載入中…</h3>
<input id="a" placeholder="">
<button id="btn">下一步</button>

<script>
const LIFF_ID = '2008741675-qAksMTVG'; // ✅ 你最新的 LIFF ID

const steps = [
  { key:'name', text:'請輸入姓名' },
  { key:'phone', text:'請輸入手機號碼' },
  { key:'birthday', text:'請輸入生日' },
  { key:'idNumber', text:'請輸入身分證字號' },
  { key:'address', text:'請輸入居住地' },
  { key:'job', text:'請輸入職業' },
  { key:'companyName', text:'請輸入公司名' },
  { key:'jobYears', text:'請輸入在職年資' },
  { key:'monthlyIncome', text:'請輸入月收入' },
  { key:'salaryInsurance', text:'是否有薪轉或勞保' },
  { key:'hasHouse', text:'是否有房屋土地' },
  { key:'hasVehicle', text:'是否有汽車機車' },
  { key:'creditCard', text:'信用卡狀況' },
  { key:'bankLoan', text:'銀行貸款' },
  { key:'financeLoan', text:'融資借款' },
  { key:'privateLoan', text:'民間借款' },
  { key:'hasNegotiation', text:'是否有協商法扣' },
  { key:'isWarning', text:'是否為警示戶' },
  { key:'hasPaymentOrder', text:'是否有支付命令' },
  { key:'hasUnpaidFine', text:'是否有未繳罰單' },
  { key:'hasBadDebt', text:'是否有呆帳' },
  { key:'hasLatePayment', text:'是否有遲繳' },
  { key:'lateHowLong', text:'遲繳多久' },
  { key:'recentApply', text:'近期是否送貸' },
  { key:'requestAmount', text:'申請額度' },
  { key:'purpose', text:'資金用途' }
];

let i = 0;
let data = {};

async function init() {
  await liff.init({ liffId: LIFF_ID });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const profile = await liff.getProfile();
  data.userId = profile.userId;

  show();
}

function show() {
  document.getElementById('q').innerText = steps[i].text;
  const input = document.getElementById('a');
  input.value = '';
  input.placeholder = steps[i].text;
}

document.getElementById('btn').onclick = async () => {
  const input = document.getElementById('a');
  if (!input.value) {
    alert('請填寫後再繼續');
    return;
  }

  data[steps[i].key] = input.value;
  i++;

  if (i < steps.length) {
    show();
    return;
  }

  // ✅ 組成一則「LINE 訊息」
  const message =
`【貸款申請】
姓名：${data.name}
手機號碼：${data.phone}
生日：${data.birthday}
身分證字號：${data.idNumber}
居住地：${data.address}
職業：${data.job}
公司名：${data.companyName}
在職年資：${data.jobYears}
月收入：${data.monthlyIncome}
薪轉勞保：${data.salaryInsurance}
房屋土地：${data.hasHouse}
汽車機車：${data.hasVehicle}
信用卡：${data.creditCard}
銀行貸款：${data.bankLoan}
融資借款：${data.financeLoan}
民間借款：${data.privateLoan}
協商法扣：${data.hasNegotiation}
警示戶：${data.isWarning}
支付命令：${data.hasPaymentOrder}
未繳罰單：${data.hasUnpaidFine}
呆帳：${data.hasBadDebt}
遲繳：${data.hasLatePayment}
遲繳多久：${data.lateHowLong}
近期送貸：${data.recentApply}
申請額度：${data.requestAmount}
資金用途：${data.purpose}`;

  // 🔥 關鍵：真的送進 LINE 官方帳聊天室
 // 🔒 傳送「JSON 格式」給 Webhook（穩定寫 Sheet）
await liff.sendMessages([
  {
    type: 'text',
    text: '##FORM_JSON##' + JSON.stringify(data)
  }
]);

  alert('申請已送出，謝謝');
  liff.closeWindow();
};

init();
</script>

</body>
</html>
